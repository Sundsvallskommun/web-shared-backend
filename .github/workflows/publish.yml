name: Publish

# Manual for now. Once 0.1.0 is real, switch the trigger to release tags.
# DO NOT RENAME THIS FILE: npm's trusted publisher matches on the filename.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace to publish
        required: true
        default: express-saml

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to npmjs
    # Must match the environment on the npm trusted publisher, or OIDC auth fails.
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      # Asserted, not installed: node 24 already bundles a new enough npm, and
      # `npm i -g npm@latest` would fetch an unpinned package into a job with id-token: write.
      - name: Verify npm supports trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          echo "npm $have (need >= $need)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm $have is too old for trusted publishing (need >= $need)"
            exit 1
          fi

      - name: Install dependencies
        run: yarn --frozen-lockfile --silent --ignore-scripts # --ignore-scripts: supply-chain hardening

      - name: Type check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Smoke test the built artifact
        run: yarn test:smoke

      # No NPM_TOKEN: auth is the OIDC id-token. See "Publish" in the README.
      - name: Publish
        working-directory: packages/${{ inputs.package }}
        run: npm publish
