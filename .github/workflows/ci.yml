name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    # Renaming this job breaks the branch ruleset: it is a required status check by name.
    name: Build and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile --silent --ignore-scripts # --ignore-scripts: supply-chain hardening

      - name: Type check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Smoke test the built artifact
        run: yarn test:smoke

      # Per-package paths, not `packages/*/dist`: upload-artifact roots the archive at the least
      # common ancestor, so a single match would flatten and unpack to the wrong place.
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-express-saml
          path: packages/express-saml/dist
          retention-days: 1

  smoke:
    # Also by name in the ruleset. 18 is the `engines` floor; vitest 4 needs >= 20 and cannot
    # cover it, which is why test/smoke.cjs is dependency-free and needs no install here.
    name: Smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-express-saml
          path: packages/express-saml/dist

      - name: Smoke test
        run: node packages/express-saml/test/smoke.cjs

  # TODO(0.1.0): add the express 4/5 compatibility matrix. See "Develop" in the README.
